<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>StatSlam - OAuth Callback</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding:60px 20px;line-height:1.7;color:#1a1a1a;background:#fff;text-align:center}
  code{display:block;word-break:break-all;background:#f3f3f3;padding:16px;border-radius:8px;margin:16px 0;font-size:15px;user-select:all}
  .err{color:#c00}
</style>
</head>
<body>
<h1>StatSlam</h1>
<div id="out">Reading authorization result...</div>
<script>
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');
  var error = params.get('error');
  var out = document.getElementById('out');
  if (error) {
    out.innerHTML = '<p class="err">Authorization failed: ' + error + '</p><p>' + (params.get('error_description') || '') + '</p>';
  } else if (code) {
    out.innerHTML = '<p>Authorization complete. Copy this code and paste it back into the terminal:</p>'
      + '<code>' + code + '</code>'
      + '<p style="color:#666;font-size:13px">state: ' + state + '</p>'
      + '<p>This tab can be closed after copying.</p>';
  } else {
    out.innerHTML = '<p class="err">No authorization code found in URL.</p>';
  }
</script>
</body>
</html>
